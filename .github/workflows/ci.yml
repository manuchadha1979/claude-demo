name: CI Pipeline

on:
  push:
    branches: [ main, feature/* ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up the exact Python version — no ambiguity
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. Install dependencies from requirements.txt — reproducible
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install production requirements AND dev requirements (which contains requests-mock)
          pip install -r requirements.txt -r requirements-dev.txt
          pip install pytest

      # 4. Run all tests — pipeline fails if any test fails
      - name: Run tests
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}  # from GitHub Secrets
        run: pytest anthropic_chat_test.py customer_support_agent_test.py -v

      # 5. (Optional) Lint — enforce code style
      - name: Lint with flake8
        run: |
          pip install flake8
          flake8 anthropic_chat_test.py --max-line-length=100